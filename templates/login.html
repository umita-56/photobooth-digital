{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-flower">♡</div>
    <span class="eyebrow">✦ YOUR TINY HAPPY PLACE ✦</span>
    <h1>Welcome <span>back!</span></h1>
    <p class="auth-subtitle">Login dulu untuk membuat little memories kamu.</p>
    <form method="post" action="{{ url_for('login') }}" class="auth-form">
      <label for="username">Username</label>
      <input id="username" name="username" maxlength="30" placeholder="Masukkan username" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required>
      <button class="primary-button" type="submit">Login ♡</button>
    </form>
    <p class="auth-switch">Belum punya akun? <a href="{{ url_for('register') }}">Daftar di sini</a></p>
  </div>
</section>
{% endblock %}
