{% extends "base.html" %}
{% block title %}Daftar Akun{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card">
    <div class="auth-flower">✿</div>
    <span class="eyebrow">✦ JOIN OUR LITTLE STUDIO ✦</span>
    <h1>Create <span>account!</span></h1>
    <p class="auth-subtitle">Buat akun baru dan simpan kenangan lucumu.</p>
    <form method="post" action="{{ url_for('register') }}" class="auth-form">
      <label for="full_name">Nama lengkap</label>
      <input id="full_name" name="full_name" maxlength="100" placeholder="Nama kamu" autocomplete="name" required>
      <label for="username">Username</label>
      <input id="username" name="username" maxlength="30" placeholder="Buat username" autocomplete="username" required>
      <small>Minimal 3 karakter; gunakan huruf, angka, atau underscore.</small>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" minlength="6" placeholder="Minimal 6 karakter" autocomplete="new-password" required>
      <label for="confirm_password">Konfirmasi password</label>
      <input id="confirm_password" type="password" name="confirm_password" minlength="6" placeholder="Ulangi password" autocomplete="new-password" required>
      <button class="primary-button" type="submit">Daftar sekarang ♡</button>
    </form>
    <p class="auth-switch">Sudah punya akun? <a href="{{ url_for('login') }}">Login di sini</a></p>
  </div>
</section>
{% endblock %}
